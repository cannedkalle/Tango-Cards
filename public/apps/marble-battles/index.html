<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Battles</title>
    <link rel="stylesheet" href="/apps/marble-battles/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-band" aria-label="Marble Battles arena">
        <canvas id="arena" width="1280" height="720"></canvas>
        <div class="scoreboard" id="scoreboard"></div>
      </section>

      <aside class="control-panel" aria-label="Game controls">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Marble Battles</p>
            <h1>Multiply / Release</h1>
          </div>
          <button id="pauseButton" class="icon-button" type="button" title="Pause or resume">Pause</button>
        </div>

        <a class="back-link" href="/">Back to Kids Play Portal</a>

        <label>
          Preset
          <select id="presetSelect"></select>
        </label>

        <div class="button-row">
          <button id="restartButton" type="button">Restart</button>
          <button id="shuffleButton" type="button">Mix Colors</button>
        </div>

        <section class="control-section">
          <h2>Board</h2>
          <div class="control-grid">
            <label>
              Teams
              <select id="teamCount">
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="8">8</option>
              </select>
            </label>
            <label>
              <span class="control-label">Grid Size <output data-for="gridSize"></output></span>
              <input id="gridSize" type="range" min="24" max="72" step="6" />
            </label>
            <label>
              <span class="control-label">Tiles per level <output data-for="levelUpEvery"></output></span>
              <input id="levelUpEvery" type="range" min="25" max="250" step="5" />
            </label>
          </div>
        </section>

        <section class="control-section">
          <h2>Look</h2>
          <div class="control-grid">
            <label>
              <span class="control-label">Marble Size <output data-for="ballRadius"></output></span>
              <input id="ballRadius" type="range" min="3" max="14" step="1" />
            </label>
            <label>
              <span class="control-label">Pinball Size <output data-for="pinballRadius"></output></span>
              <input id="pinballRadius" type="range" min="3" max="6" step="1" />
            </label>
          </div>
        </section>

        <section class="control-section">
          <h2>Pins and marbles</h2>
          <div class="control-grid">
            <label>
              Starting Number
              <input id="startingReserve" type="number" min="1" max="200" step="1" />
            </label>
            <label>
              <span class="control-label">Marbles at once <output data-for="concurrentPinballs"></output></span>
              <input id="concurrentPinballs" type="range" min="1" max="6" step="1" />
            </label>
            <label>
              <span class="control-label">Gate Rate <output data-for="gateRate"></output></span>
              <input id="gateRate" type="range" min="0.4" max="3" step="0.05" />
            </label>
            <label>
              Slots and Widths
              <input id="gateSlots" type="text" spellcheck="false" placeholder="S,S,R,S,S" />
            </label>
          </div>
        </section>

        <section class="control-section">
          <h2>Launchers</h2>
          <div class="control-grid">
            <label>
              <span class="control-label">Marble Power <output data-for="marblePower"></output></span>
              <input id="marblePower" type="range" min="1" max="5" step="1" />
            </label>
            <label>
              <span class="control-label">Base HP <output data-for="cannonBaseHp"></output></span>
              <input id="cannonBaseHp" type="range" min="1" max="30" step="1" />
            </label>
            <label>
              <span class="control-label">Speed <output data-for="speed"></output></span>
              <input id="speed" type="range" min="30" max="260" step="5" />
            </label>
            <label>
              <span class="control-label">Cannon Turn <output data-for="cannonTurnSpeed"></output></span>
              <input id="cannonTurnSpeed" type="range" min="0" max="3" step="0.05" />
            </label>
            <label>
              <span class="control-label">Marble limit <output data-for="maxActiveMarbles"></output></span>
              <input id="maxActiveMarbles" type="range" min="100" max="700" step="20" />
            </label>
          </div>
        </section>

        <section class="status-strip" id="statusStrip"></section>
      </aside>
    </main>

    <script type="module" src="/apps/marble-battles/src/main.js"></script>
  </body>
</html>
