name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:before-the-bulb
      - run: npm run wild-guess:test
      - run: npm run test:twin-terms
      - run: npm run test:twin-terms-images
      - run: npm run test:before-the-bulb-images
      - run: npm run test:name-quest
      - run: npm run test:marble-battles
      - run: npm run test:animal-outsider
      - run: npm run test:tango-cards
      - run: npm run build
