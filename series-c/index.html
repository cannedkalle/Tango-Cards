<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="../">
    <title>Series C - Tango Cards</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-series-key="series-c">
    <header class="topbar">
      <div>
        <p class="eyebrow">Tango Cards</p>
        <h1>Series C</h1>
      </div>
      <div class="stats" aria-label="Gallery counts">
        <span id="visibleCount">0 cards</span>
        <span id="seriesCount">Series C</span>
      </div>
    </header>

    <main>
      <section id="gallerySection" class="gallery-section" aria-live="polite">
        <div class="gallery-header">
          <a class="back-button" href="./">Back</a>
          <h2 id="galleryHeading"></h2>
        </div>
        <div class="controls" aria-label="Gallery controls">
          <div id="ratingFilters" class="segmented" aria-label="Rating filters"></div>
          <button id="densityToggle" class="icon-button" type="button" aria-label="Toggle large cards" title="Toggle large cards">
            <span aria-hidden="true">□</span>
          </button>
        </div>

        <section id="gallery" class="gallery"></section>
      </section>
    </main>

    <dialog id="previewDialog" class="preview-dialog">
      <button id="closePreview" class="close-button" type="button" aria-label="Close preview">×</button>
      <div class="preview-shell">
        <img id="previewImage" alt="">
        <aside>
          <p id="previewSeries" class="eyebrow"></p>
          <h2 id="previewTitle"></h2>
          <dl>
            <div>
              <dt>Card</dt>
              <dd id="previewNumber"></dd>
            </div>
            <div>
              <dt>Status</dt>
              <dd id="previewStatus"></dd>
            </div>
          </dl>
          <div id="previewRating"></div>
          <a id="previewDownload" class="download-link" href="#" download>Download JPG</a>
        </aside>
      </div>
    </dialog>

    <script src="cards-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
